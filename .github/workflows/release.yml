name: Publicar Mod Loader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mod-loader-stable
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Definir a versão estável
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $repo = "repos/$env:GITHUB_REPOSITORY"
          $head = gh api "$repo/git/ref/heads/main" --jq '.object.sha'
          if ($head -ne $env:GITHUB_SHA) {
            Write-Host 'A main já recebeu outro commit.'
            return
          }

          $latest = gh api "$repo/releases/latest" | ConvertFrom-Json
          if ($latest.tag_name -notmatch '^v\d+\.\d+\.\d+$') { throw 'Tag estável inválida.' }
          if ($latest.target_commitish -eq $env:GITHUB_SHA) {
            "tag=$($latest.tag_name)" >> $env:GITHUB_OUTPUT
            return
          }

          $source = 'Instalador/Online/Fonte/GeneralUpdates.cs'
          $content = Get-Content -LiteralPath $source -Raw
          $pattern = 'CurrentVersion="(\d+\.\d+\.\d+)"'
          $match = [regex]::Match($content, $pattern)
          if (!$match.Success) { throw 'Versão do aplicativo ausente.' }

          $current = [version]$latest.tag_name.Substring(1)
          $next = [version]$match.Groups[1].Value
          if ($next -le $current) {
            $next = [version]::new($current.Major, $current.Minor, $current.Build + 1)
          }
          $releases = @(gh api --paginate "$repo/releases" --jq '.[] | {tag_name,draft,target_commitish}' |
            ForEach-Object { $_ | ConvertFrom-Json })
          $tags = @(git ls-remote --tags --refs origin | ForEach-Object { ($_ -split 'refs/tags/', 2)[1] })
          while ("v$next" -in $tags -or ($releases | Where-Object {
            $_.tag_name -eq "v$next" -and (!$_.draft -or $_.target_commitish -ne $env:GITHUB_SHA)
          })) {
            $next = [version]::new($next.Major, $next.Minor, $next.Build + 1)
          }

          $content = $content -replace $pattern, "CurrentVersion=`"$next`""
          Set-Content -LiteralPath $source -Value $content -NoNewline -Encoding utf8
          "tag=v$next" >> $env:GITHUB_OUTPUT
          'build=true' >> $env:GITHUB_OUTPUT

      - name: Empacotar e testar
        if: steps.version.outputs.build == 'true'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $work = Join-Path $env:GITHUB_WORKSPACE 'T/CI'
          dotnet tool install vpk --version 1.2.161 --tool-path "$work/tools"
          dotnet restore ./Instalador/Setup/Velopack.Dependencies.csproj --packages "$work/nuget"
          ./Instalador/Setup/compilar-velopack.ps1 -NuGetPackages "$work/nuget" -Vpk "$work/tools/vpk.exe" -OutputPath $work
          $fixture = New-Item -ItemType Directory "$work/test"
          $test = Start-Process -FilePath "$work/App/ModLoader.exe" -ArgumentList '--self-test-updates', ('"' + $fixture.FullName + '"') -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw "Teste do atualizador falhou ($($test.ExitCode))." }

      - name: Publicar a atualização
        if: steps.version.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $repo = "repos/$env:GITHUB_REPOSITORY"
          $head = gh api "$repo/git/ref/heads/main" --jq '.object.sha'
          if ($head -ne $env:GITHUB_SHA) {
            Write-Host 'A atualização será gerada pelo envio mais recente à main.'
            return
          }
          $tag = $env:RELEASE_TAG
          $version = $tag.Substring(1)
          $releaseDir = 'T/CI/Release'
          $feed = Get-Content "$releaseDir/releases.win.json" -Raw | ConvertFrom-Json
          $packageName = "IINasK.ModLoader-$version-full.nupkg"
          $package = $feed.Assets | Where-Object {
            $_.Type -eq 'Full' -and $_.PackageId -eq 'IINasK.ModLoader' -and
            $_.Version -eq $version -and $_.FileName -eq $packageName
          }
          $file = Get-Item "$releaseDir/$packageName"
          if ($feed.Assets.Count -ne 1 -or !$package -or $file.Length -ne $package.Size -or
            (Get-FileHash -LiteralPath $file.FullName).Hash -ne $package.SHA256) {
            throw 'O manifesto Velopack não corresponde ao pacote gerado.'
          }

          $draft = gh api --paginate "$repo/releases" --jq ".[] | select(.tag_name == `"$tag`")" | ConvertFrom-Json
          if (!$draft) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Mod Loader $version" --generate-notes --draft
          } elseif (!$draft.draft -or $draft.target_commitish -ne $env:GITHUB_SHA) {
            throw "A versão $tag já pertence a outra publicação."
          }
          $names = @('Mod-Loader-Setup.exe', 'releases.win.json', $packageName)
          $paths = $names | ForEach-Object { Join-Path $releaseDir $_ }
          gh release upload $tag @paths --repo $env:GITHUB_REPOSITORY --clobber
          $assets = gh api --paginate "$repo/releases" --jq ".[] | select(.tag_name == `"$tag`") | .assets" | ConvertFrom-Json
          if ($assets.Count -ne $names.Count) { throw 'O rascunho contém arquivos inesperados.' }
          foreach ($name in $names) {
            $asset = $assets | Where-Object name -eq $name
            $local = Get-Item (Join-Path $releaseDir $name)
            if (!$asset -or $asset.state -ne 'uploaded' -or $asset.size -ne $local.Length -or
              $asset.digest -ne ('sha256:' + (Get-FileHash -LiteralPath $local.FullName).Hash)) {
              throw "Falha ao conferir $name no GitHub."
            }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          "### [Mod Loader $version](https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag)" >> $env:GITHUB_STEP_SUMMARY

      - name: Conferir o feed publicado
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $repo = "repos/$env:GITHUB_REPOSITORY"
          if ((gh api "$repo/git/ref/heads/main" --jq '.object.sha') -ne $env:GITHUB_SHA) { return }
          $tag = $env:RELEASE_TAG
          if ((gh api "$repo/releases/latest" --jq '.tag_name') -ne $tag -or
            (gh api "$repo/git/ref/tags/$tag" --jq '.object.sha') -ne $env:GITHUB_SHA) {
            throw 'A versão estável não aponta para o commit publicado.'
          }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"
          $version = $tag.Substring(1)
          $body = (Invoke-WebRequest "$url/releases.win.json" -MaximumRetryCount 3 -RetryIntervalSec 2).Content
          if ($body -is [byte[]]) { $body = [Text.Encoding]::UTF8.GetString($body) }
          $package = ($body | ConvertFrom-Json).Assets | Where-Object {
            $_.Type -eq 'Full' -and $_.PackageId -eq 'IINasK.ModLoader' -and
            $_.Version -eq $version -and $_.FileName -eq "IINasK.ModLoader-$version-full.nupkg"
          }
          if (!$package) { throw 'O feed público ainda não oferece esta versão.' }
          $download = (Invoke-WebRequest "$url/$($package.FileName)" -MaximumRetryCount 3 -RetryIntervalSec 2).RawContentStream
          $download.Position = 0
          if ($download.Length -ne $package.Size -or (Get-FileHash -InputStream $download).Hash -ne $package.SHA256) {
            throw 'O pacote público diverge do manifesto.'
          }
